# Copy to .github/workflows/reviewbharat.yml in your repository.
name: ReviewBharat
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: SoAkeD1/reviewbharat@main
        with:
          bharatcode_api_key: ${{ secrets.BHARATCODE_API_KEY }}
          lang: en          # or hinglish / hi
          fail_on: critical # optional: fail the check on critical findings
