<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewBharat</title>
<style>
  :root { --bg:#0f0f10; --card:#19191b; --line:#2c2c30; --text:#ececef; --mute:#a3a3ad; --accent:#ff9f43; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:28px; } h1 span { color:var(--accent); }
  p.sub { color:var(--mute); margin:0 0 24px; }
  input[type=text], textarea, select { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
  select { width:auto; padding:8px 10px; }
  textarea { min-height:160px; font-family:ui-monospace,Consolas,monospace; font-size:13px; margin-top:10px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  button { background:var(--accent); color:#1b1206; border:0; border-radius:8px; padding:10px 18px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--mute); border:1px solid var(--line); font-weight:500; }
  button:disabled { opacity:.5; cursor:wait; }
  label { color:var(--mute); font-size:14px; display:inline-flex; gap:6px; align-items:center; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
  .badge.live { color:#73d13d; border-color:#3a5a26; }
  #out { margin-top:28px; }
  .summary { color:var(--mute); margin-bottom:16px; }
  .finding { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  .finding h3 { margin:0 0 2px; font-size:16px; }
  .meta { color:var(--mute); font:12px ui-monospace,Consolas,monospace; margin-bottom:6px; word-break:break-all; }
  .sug { margin-top:8px; padding:8px 10px; background:#111113; border-radius:6px; white-space:pre-wrap; overflow-x:auto; font-size:14px; }
  .critical{--c:#ff4d4f}.high{--c:#ff7a45}.medium{--c:#ffa940}.low{--c:#d4b106}.nit{--c:#8c8c8c}
  .error { color:#ff7875; }
  .warn { color:#ffc53d; }
  footer { margin-top:40px; color:var(--mute); font-size:13px; }
  footer a { color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Review<span>Bharat</span></h1>
  <p class="sub">AI code review for pull requests, powered by the BharatCode API.</p>
  <label for="url" style="display:block;margin-bottom:6px">GitHub pull request URL</label>
  <input type="text" id="url" placeholder="https://github.com/owner/repo/pull/123" autocomplete="off">
  <textarea id="diff" aria-label="Unified diff" placeholder="...or paste a unified diff (git diff output) here"></textarea>
  <div class="row">
    <button id="go">Review</button>
    <button id="sample" class="ghost" type="button">Load sample diff</button>
    <label>Language
      <select id="lang">
        <option value="en">English</option>
        <option value="hinglish">Hinglish</option>
        <option value="hi">हिन्दी</option>
      </select>
    </label>
    <label><input type="checkbox" id="demo"> Demo mode</label>
    <span class="badge" id="status">checking…</span>
  </div>
  <div id="out" aria-live="polite"></div>
  <footer>Demo mode runs offline pattern checks (no AI). With a BharatCode API key, reviews come from the model. <a href="https://github.com/SoAkeD1/reviewbharat">Source on GitHub</a></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const SAMPLE = `diff --git a/app/db.py b/app/db.py
--- a/app/db.py
+++ b/app/db.py
@@ -10,3 +10,11 @@ import sqlite3
 conn = sqlite3.connect("app.db")
+API_KEY = "demo-hardcoded-secret-123"
+
+def get_user(name):
+    # TODO: add caching
+    cur = conn.execute("SELECT * FROM users WHERE name = '" + name + "'")
+    try:
+        return cur.fetchone()
+    except:
+        pass
diff --git a/web/calc.js b/web/calc.js
--- a/web/calc.js
+++ b/web/calc.js
@@ -1,1 +1,4 @@
 export function add(a, b) { return a + b; }
+export function run(expr) {
+  return eval(expr);
+}
`;

fetch('/api/status').then(r => r.json()).then(s => {
  const b = $('status');
  if (s.live) { b.textContent = 'AI live: ' + s.model; b.classList.add('live'); }
  else { b.textContent = 'No API key: demo mode'; $('demo').checked = true; $('demo').disabled = true; }
}).catch(() => { $('status').textContent = 'server offline'; });

$('sample').onclick = () => { $('url').value = ''; $('diff').value = SAMPLE; $('diff').focus(); };

$('go').onclick = async () => {
  const out = $('out'); out.replaceChildren();
  $('go').disabled = true; out.append(el('p', 'summary', 'Reviewing… large PRs can take a minute.'));
  try {
    const res = await fetch('/api/review', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: $('url').value.trim(), diff: $('diff').value, demo: $('demo').checked, lang: $('lang').value }) });
    const r = await res.json();
    out.replaceChildren();
    if (!res.ok) throw new Error(r.error || 'Request failed');
    out.append(el('p', 'summary', r.summary + ' ' + r.findings.length + ' finding(s) in ' + r.files.length + ' file(s).'));
    if (r.demo && $('lang').value === 'hi') out.append(el('p', 'warn', 'Demo mode explains in Hinglish; full Hindi needs the AI model.'));
    if (r.partialFiles && r.partialFiles.length) out.append(el('p', 'warn', 'Very large diff: only part of ' + r.partialFiles.join(', ') + ' was reviewed.'));
    if (!r.findings.length) out.append(el('p', '', 'No problems found. ✅'));
    for (const f of r.findings) {
      const d = el('article', 'finding ' + f.severity);
      d.append(el('h3', '', f.title));
      d.append(el('div', 'meta', f.file + (f.line ? ':' + f.line : '') + ' · ' + f.severity));
      if (f.explanation) d.append(el('div', '', f.explanation));
      if (f.suggestion) d.append(el('div', 'sug', f.suggestion));
      out.append(d);
    }
  } catch (e) { out.replaceChildren(el('p', 'error', 'Error: ' + e.message)); }
  $('go').disabled = false;
};
</script>
</body>
</html>
