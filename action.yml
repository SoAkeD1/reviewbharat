name: ReviewBharat
description: AI code review for pull requests, built on the BharatCode API (or any OpenAI-compatible API). Posts findings as a PR comment.
author: Shrimon Mishra
branding:
  icon: check-circle
  color: orange
inputs:
  provider:
    description: "LLM provider: bharatcode, groq, gemini, openrouter or custom."
    required: false
    default: bharatcode
  api_key:
    description: API key for the chosen provider (store it as a repository secret). Without it, offline demo checks run instead.
    required: false
    default: ''
  bharatcode_api_key:
    description: Deprecated alias of api_key for the BharatCode provider.
    required: false
    default: ''
  model:
    description: Model name. Empty = the provider's default.
    required: false
    default: ''
  base_url:
    description: OpenAI-compatible base URL (needed only for provider custom).
    required: false
    default: ''
  github_token:
    description: Token used to read the PR diff and post the comment.
    required: false
    default: ${{ github.token }}
  lang:
    description: "Language for explanations: en, hinglish or hi."
    required: false
    default: en
  fail_on:
    description: Fail the check if any finding is at or above this severity (critical, high, medium, low, nit). Empty = never fail.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Review pull request
      shell: bash
      run: node "${{ github.action_path }}/src/action.js"
      env:
        LLM_PROVIDER: ${{ inputs.provider }}
        LLM_API_KEY: ${{ inputs.api_key || inputs.bharatcode_api_key }}
        LLM_MODEL: ${{ inputs.model }}
        LLM_BASE_URL: ${{ inputs.base_url }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
